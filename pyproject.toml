[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-osint-lab"
version = "0.1.0"
description = "PHOMBER + Qwen2 SLM PoC — local AI-assisted OSINT on Raspberry Pi 4B"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
]

[project.scripts]
osint = "orchestrator.main:main"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

# ── Dependencias de desarrollo (uv) ───────────────────────────────────────────
[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
