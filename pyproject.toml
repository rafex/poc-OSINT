# edge-osint-lab — Workspace root
#
# Este archivo configura el espacio de trabajo UV.
# NO es un paquete instalable.
#
# Proyectos independientes:
#   orchestrator/   → paquete Python del orquestador (openai, uv sync)
#   scripts/        → scripts PEP 723 (cada uno gestiona sus propias deps)
#
# Uso desde la raíz:
#   uv --directory orchestrator sync
#   uv --directory orchestrator run -m orchestrator.main
#   uv --directory scripts sync --dev

[tool.uv.workspace]
members = ["orchestrator"]
